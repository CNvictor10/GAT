{% extends "base.html" %}

{% block title %}{{ t('landing_bienvenido') }}{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
    <img src="{{ url_for('static', filename='images/vico.png') }}" alt="{{ t('landing_alt_logo') }}" class="landing-logo mb-4" style="max-width: 200px;">

    <h1 class="display-4 mb-4" style="color: var(--primary-dark); font-weight: 700;">
        {{ t('landing_h1') }}
    </h1>

    <p class="lead mb-5" style="color: var(--text-secondary); max-width: 600px;">
        {{ t('landing_subtitulo') }}
    </p>

    <div class="d-flex gap-3">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-4">
            <i class="fas fa-sign-in-alt me-2"></i>{{ t('menu_iniciar_sesion') }}
        </a>
        <a href="{{ url_for('registro') }}" class="btn btn-secondary btn-lg px-4">
            <i class="fas fa-user-plus me-2"></i>{{ t('reg_btn') }}
        </a>
    </div>
</div>
{% endblock %}
