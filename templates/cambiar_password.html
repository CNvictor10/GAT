{% extends 'base.html' %}

{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Crea una contraseña nueva</h1>
            <p class="text-muted">Por seguridad, debes reemplazar la contraseña temporal antes de continuar.</p>
            <form method="POST" action="{{ url_for('cambiar_password') }}">
                <div class="mb-3">
                    <label for="password" class="form-label">Nueva contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required>
                        <button class="btn btn-outline-secondary" type="button" data-toggle-password data-target="#password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
                    </div>
                    <div class="form-text">Usa al menos 8 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmar_password" class="form-label">Confirmar contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmar_password" name="confirmar_password" minlength="8" autocomplete="new-password" required>
                        <button class="btn btn-outline-secondary" type="button" data-toggle-password data-target="#confirmar_password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
